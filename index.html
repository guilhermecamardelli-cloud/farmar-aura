<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Farmar Aura</title>
<style>
  :root{
    --bg1:#0e0b1f; --bg2:#1d1442; --card:#1a1535; --card2:#241c4a;
    --txt:#f3efff; --mut:#a79ecb; --aura:#b388ff; --gold:#ffd54f; --ok:#69f0ae;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(ellipse at 30% 0%,var(--bg2),var(--bg1) 70%);
    color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;overflow-x:hidden;
  }
  .app{display:grid;grid-template-columns:1fr 340px;gap:16px;max-width:980px;margin:0 auto;padding:16px;min-height:100%}
  @media(max-width:760px){.app{grid-template-columns:1fr}}

  /* ---------- palco ---------- */
  .stage{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
  h1{margin:0;font-size:1.1rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mut)}
  .score{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:800;color:var(--aura);text-shadow:0 0 24px var(--aura);margin-top:6px;line-height:1}
  .rate{color:var(--mut);margin:6px 0 0;font-size:.95rem}
  .rate b{color:var(--txt)}

  .arena{position:relative;width:260px;height:320px;margin:10px 0;cursor:pointer;touch-action:manipulation}
  .glow{
    position:absolute;left:50%;top:48%;width:var(--glow,160px);height:var(--glow,160px);
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(179,136,255,.85),rgba(179,136,255,0) 68%);
    animation:pulse 2.2s ease-in-out infinite;transition:width .5s,height .5s;
  }
  .gold .glow{background:radial-gradient(circle,rgba(255,213,79,.9),rgba(255,213,79,0) 68%)}
  @keyframes pulse{50%{opacity:.55;transform:translate(-50%,-50%) scale(1.08)}}

  .char{position:absolute;left:50%;top:30px;width:0;height:0;transition:transform .08s}
  .char.spin{animation:spin .9s cubic-bezier(.3,.7,.3,1)}
  @keyframes spin{
    0%{transform:translateY(0) rotateY(0)}
    40%{transform:translateY(-60px) rotateY(540deg)}
    100%{transform:translateY(0) rotateY(1080deg)}
  }

  /* ---------- boneco (SVG montado pelo JS) ---------- */
  .char svg{position:absolute;left:-100px;top:-14px;overflow:visible}
  /* articulações: o JS gira cada uma; o ponto de giro (transform-origin) vem do estilo */
  .junta{transition:transform .14s ease-out}
  .shades{display:none}
  .shades.on{display:inline}
  /* mão: normal parada; aberta só quando o movimento já foi liberado e o boneco está farmando */
  .mao-aberta{display:none}
  .abrir .mao-aberta{display:inline}
  .abrir .mao-normal{display:none}
  /* piscar os olhos */
  .olhos{transform-box:fill-box;transform-origin:center;animation:piscar 4s infinite}
  @keyframes piscar{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  /* respirar: o boneco todo (menos as pernas) sobe um pouquinho */
  .respira{animation:respira 2.4s ease-in-out infinite}
  @keyframes respira{50%{transform:translateY(-3px)}}

  .pop{position:absolute;pointer-events:none;font-weight:800;color:var(--gold);text-shadow:0 2px 6px #000;
       animation:pop .9s ease-out forwards;white-space:nowrap}
  @keyframes pop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}

  .combo{width:100%;max-width:300px}
  .combo .lbl{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mut);margin-bottom:4px}
  .bar{height:10px;background:#0006;border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--aura),var(--gold));transition:width .1s}

  .btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
  button{font:inherit;color:var(--txt);border:0;cursor:pointer}
  .spinbtn{background:var(--aura);color:#12082e;font-weight:800;padding:12px 18px;border-radius:12px;position:relative;overflow:hidden;min-width:190px}
  .spinbtn[disabled]{opacity:.55;cursor:not-allowed}
  .spinbtn .cd{position:absolute;left:0;bottom:0;height:4px;background:#12082e88;width:0}
  .hint{font-size:.78rem;color:var(--mut);margin-top:10px;text-align:center}
  .nivel{font-size:.85rem;color:var(--txt);margin:6px 0 0;text-align:center}
  .nivel span{color:var(--mut)}

  /* ---------- loja ---------- */
  .shop{background:var(--card);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
  .shop h2{margin:0 0 4px;font-size:1rem;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
  .estilos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
  .est{background:var(--card2);padding:8px 4px;border-radius:10px;border:2px solid transparent;font-size:.8rem}
  .est:hover{border-color:#b388ff55}
  .est.ativo{border-color:var(--aura)}
  .up{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;background:var(--card2);padding:10px 12px;border-radius:12px;border:2px solid transparent}
  .up:disabled{opacity:.45;cursor:not-allowed}
  .up:not(:disabled){border-color:#b388ff55}
  .up:not(:disabled):hover{border-color:var(--aura)}
  .up .n{font-weight:700}
  .up .c{color:var(--gold);font-weight:700;text-align:right}
  .up .d{grid-column:1/2;font-size:.8rem;color:var(--mut)}
  .up .q{grid-column:2/3;text-align:right;font-size:.8rem;color:var(--ok)}
  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:var(--mut)}
  .foot button{background:none;color:var(--mut);text-decoration:underline;font-size:.75rem}
</style>
</head>
<body>
<div class="app">

  <main class="stage" id="stage">
    <h1>Farmar Aura</h1>
    <div class="score" id="score">0</div>
    <p class="rate"><b id="perClick">1</b> por clique · <b id="perSec">0</b> por segundo</p>

    <div class="arena" id="arena" aria-label="Clique para farmar aura">
      <div class="glow" id="glow"></div>
      <div class="char" id="char"><!-- o boneco é desenhado pelo JS (veja ESTILOS) --></div>
    </div>

    <div class="combo">
      <div class="lbl"><span>Combo <b id="mult">x1</b></span><span>mantenha o ritmo!</span></div>
      <div class="bar"><i id="comboBar"></i></div>
    </div>
    <p class="nivel" id="nivelInfo"></p>

    <div class="btns">
      <button class="spinbtn" id="spinBtn">🌀 Giro da Aura (espaço)<span class="cd" id="cd"></span></button>
    </div>
    <p class="hint">Clique no boneco, ou use <b>A / D</b> e as <b>setas</b>. O giro dá aura extra.</p>
  </main>

  <aside class="shop">
    <h2>Boneco</h2>
    <div class="estilos" id="estilos"></div>
    <h2>Melhorias</h2>
    <div id="shopList" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="foot"><span id="saveInfo">Salvo automaticamente</span><button id="reset">Recomeçar</button></div>
  </aside>
</div>

<script>
(function(){
  "use strict";

  /* ---------- melhorias ---------- */
  // tipo "click": soma ao valor do clique | tipo "auto": soma aura por segundo
  const UPGRADES = [
    {id:"braco",   name:"💪 Braço mais forte",     desc:"+1 aura por clique",       type:"click", val:1,   base:15},
    {id:"pose",    name:"😎 Pose de confiança",    desc:"+1 aura por segundo",      type:"auto",  val:1,   base:50},
    {id:"oculos",  name:"🕶️ Óculos escuros",       desc:"+5 aura por segundo",      type:"auto",  val:5,   base:300},
    {id:"punho",   name:"👊 Punho de ouro",        desc:"+10 aura por clique",      type:"click", val:10,  base:1000},
    {id:"trilha",  name:"🎵 Trilha sonora épica",  desc:"+30 aura por segundo",     type:"auto",  val:30,  base:2500},
    {id:"corrente",name:"⛓️ Corrente de ouro",     desc:"+150 aura por segundo",    type:"auto",  val:150, base:12000},
    {id:"lenda",   name:"👑 Lenda da Aura",        desc:"+1000 aura por segundo",   type:"auto",  val:1000,base:90000}
  ];
  const GROWTH = 1.15;
  const SAVE_KEY = "farmar-aura-v1";
  const SPIN_CD = 6000;       // ms
  const COMBO_MAX = 30;

  /* ---------- movimentos (liberados conforme a aura total) ---------- */
  // ângulos em graus: o = ombro, c = cotovelo, p = pulso (L = esquerdo, R = direito)
  // o braço direito é desenhado espelhado, então nos dois lados: positivo = abre para fora/para cima
  const REST = {oL:15, cL:-10, pL:0, oR:15, cR:-10, pR:0, corpo:0, cabeca:0};
  const NIVEIS = [
    {aura:0, nome:"Braços", maoAberta:false, poses:[
      // só o ombro: um braço sobe, o outro desce
      {oL:130, cL:0, pL:0, oR:15,  cR:0, pR:0, corpo:0, cabeca:0},
      {oL:15,  cL:0, pL:0, oR:130, cR:0, pR:0, corpo:0, cabeca:0}
    ]},
    {aura:300, nome:"Cotovelos", maoAberta:false, poses:[
      // a mão sobe perto do rosto dobrando o cotovelo
      {oL:45, cL:20,  pL:0, oR:60, cR:110, pR:0, corpo:-2, cabeca:3},
      {oL:60, cL:110, pL:0, oR:45, cR:20,  pR:0, corpo:2,  cabeca:-3}
    ]},
    {aura:3000, nome:"Mãos abertas", maoAberta:true, poses:[
      {oL:45, cL:20,  pL:20, oR:60, cR:110, pR:15, corpo:-2, cabeca:3},
      {oL:60, cL:110, pL:15, oR:45, cR:20,  pR:20, corpo:2,  cabeca:-3}
    ]},
    {aura:30000, nome:"Onda de aura", maoAberta:true, poses:[
      // o pulso vira de um lado para o outro e o corpo balança junto
      {oL:45, cL:20,  pL:30,  oR:60, cR:110, pR:15,  corpo:-3, cabeca:5},
      {oL:60, cL:110, pL:15,  oR:45, cR:20,  pR:30,  corpo:3,  cabeca:-5},
      {oL:40, cL:30,  pL:-25, oR:60, cR:115, pR:-20, corpo:-2, cabeca:4},
      {oL:60, cL:115, pL:-20, oR:40, cR:30,  pR:-25, corpo:2,  cabeca:-4}
    ]}
  ];

  /* ---------- desenho: rosto e mãos (reaproveitados pelos estilos) ---------- */
  // rosto confiante: olhar de canto, sobrancelha levantada, sorriso de lado
  function rosto(x, y, escala, cor = "#1b1b1b", olho = "#fff"){
    return `<g transform="translate(${x} ${y}) scale(${escala})">
      <path d="M-34 -16 Q-21 -25 -8 -18" fill="none" stroke="${cor}" stroke-width="4" stroke-linecap="round"/>
      <path d="M8 -12 L34 -15" fill="none" stroke="${cor}" stroke-width="4" stroke-linecap="round"/>
      <g class="olhos">
        <path d="M-32 -2 Q-20 11 -8 -2 Z" fill="${olho}" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M8 -2 Q20 11 32 -2 Z" fill="${olho}" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="-15" cy="2" r="4.5" fill="${cor}"/><circle cx="25" cy="2" r="4.5" fill="${cor}"/>
        <path d="M-35 -3 L-5 -2" stroke="${cor}" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M5 -2 L35 -3" stroke="${cor}" stroke-width="4.5" stroke-linecap="round"/>
      </g>
      <path d="M-12 25 Q2 31 14 18" fill="none" stroke="${cor}" stroke-width="3.5" stroke-linecap="round"/>
      <g id="shades" class="shades">
        <rect x="-38" y="-10" width="33" height="18" rx="6" fill="#111"/>
        <rect x="5" y="-10" width="33" height="18" rx="6" fill="#111"/>
        <rect x="-6" y="-5" width="12" height="4" fill="#111"/>
        <rect x="-33" y="-7" width="9" height="3" rx="1.5" fill="#fff" opacity=".5"/>
        <rect x="10" y="-7" width="9" height="3" rx="1.5" fill="#fff" opacity=".5"/>
      </g>
    </g>`;
  }

  // cada tipo de mão tem dois desenhos: "normal" (relaxada) e "aberta" (espalmada).
  // a mão é desenhada com o pulso no ponto (0,0), apontando para baixo, polegar para fora do corpo
  const CONTORNO = "#1b1b1b";
  const MAOS = {
    redonda: {
      normal: c => `
        <ellipse cx="-8" cy="9" rx="4" ry="6" fill="${c}" stroke="${CONTORNO}" stroke-width="2.5"/>
        <path d="M-8 0 Q-11 15 -5 21 Q0 24 5 21 Q11 15 8 0 Z" fill="${c}" stroke="${CONTORNO}" stroke-width="2.5"/>`,
      aberta: c => {
        const dedos = ["M-8 6 L-19 13","M-6 13 L-11 30","M-2 15 L-3 34","M2 15 L5 33","M6 13 L11 28"];
        return dedos.map(d=>`<path d="${d}" stroke="${CONTORNO}" stroke-width="8.5" stroke-linecap="round"/>`).join("")
             + dedos.map(d=>`<path d="${d}" stroke="${c}" stroke-width="4.5" stroke-linecap="round"/>`).join("")
             + `<ellipse cx="0" cy="9" rx="10" ry="10" fill="${c}" stroke="${CONTORNO}" stroke-width="2.5"/>`;
      }
    },
    bloco: {
      normal: c => `
        <rect x="-13" y="4" width="6" height="10" fill="${c}" stroke="${CONTORNO}" stroke-width="2.5"/>
        <rect x="-9" y="0" width="18" height="20" rx="2" fill="${c}" stroke="${CONTORNO}" stroke-width="2.5"/>`,
      aberta: c => [[-7,18],[-2.5,6],[2,-6],[6.5,-18]]
          .map(([x,a])=>`<rect x="${x-2.5}" y="10" width="5" height="16" fill="${c}" stroke="${CONTORNO}" stroke-width="2" transform="rotate(${a} ${x} 10)"/>`).join("")
        + `<rect x="-13" y="4" width="6" height="12" fill="${c}" stroke="${CONTORNO}" stroke-width="2" transform="rotate(50 -10 4)"/>`
        + `<rect x="-9" y="0" width="18" height="14" rx="2" fill="${c}" stroke="${CONTORNO}" stroke-width="2.5"/>`
    },
    palito: {
      normal: c => `<circle cx="0" cy="3" r="4.5" fill="${c}"/>`,
      aberta: c => ["M0 2 L-10 7","M0 2 L-7 13","M0 2 L-1 15","M0 2 L5 14","M0 2 L9 10"]
          .map(d=>`<path d="${d}" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`).join("")
    }
  };

  /* ---------- estilos de boneco ---------- */
  // cada estilo diz onde fica o ombro (do braço esquerdo), o tamanho dos braços,
  // as cores e o desenho das partes. O braço direito é o esquerdo espelhado.
  const PELE = "#ffcfa3";
  const CLARO = "#f3efff";
  const ESTILOS = {
    chibi: {
      nome:"😎 Chibi",
      ombro:[78,142], braco:24, antebraco:24, grossura:14, forma:"tubo",
      corBraco:"url(#roupa)", corAntebraco:"url(#roupa)", mao:"redonda", corMao:PELE, tamMao:1.1,
      pescoco:[100,132], quadril:[100,196],
      fundo:`
        <ellipse cx="100" cy="246" rx="46" ry="7" fill="#000" opacity=".35"/>
        <rect x="82" y="188" width="16" height="44" rx="7" fill="url(#calca)" stroke="#1b1b1b" stroke-width="3"/>
        <rect x="102" y="188" width="16" height="44" rx="7" fill="url(#calca)" stroke="#1b1b1b" stroke-width="3"/>
        <ellipse cx="87" cy="236" rx="14" ry="8" fill="#fff" stroke="#1b1b1b" stroke-width="3"/>
        <ellipse cx="113" cy="236" rx="14" ry="8" fill="#fff" stroke="#1b1b1b" stroke-width="3"/>`,
      tronco:`
        <rect x="70" y="128" width="60" height="66" rx="18" fill="url(#roupa)" stroke="#1b1b1b" stroke-width="3"/>
        <rect x="71.5" y="152" width="57" height="14" fill="#c9b8ff"/>
        <path d="M100 131 L100 192" stroke="#1b1b1b" stroke-width="2"/>
        <path d="M86 136 L90 142 L86 148 L82 142 Z" fill="#ffd54f" stroke="#1b1b1b" stroke-width="1.5"/>`,
      cabeca:`
        <circle cx="100" cy="78" r="56" fill="url(#pele)" stroke="#1b1b1b" stroke-width="3"/>
        <path d="M44 82 Q36 18 100 16 Q166 18 156 82 Q150 54 132 46 L127 62 L114 42 L103 60 L90 42 L80 60 Q60 52 44 82 Z"
              fill="#2b1a0e" stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round"/>
        ${rosto(100, 88, 1)}`
    },
    cartoon: {
      nome:"🙂 Cartoon",
      ombro:[63,100], braco:40, antebraco:40, grossura:16, forma:"tubo",
      corBraco:"url(#roupa)", corAntebraco:"url(#pele)", mao:"redonda", corMao:PELE, tamMao:1,

      tronco:`
        <rect x="68" y="88" width="64" height="106" rx="18" fill="url(#roupa)" stroke="#1b1b1b" stroke-width="3"/>
        <rect x="70" y="172" width="60" height="8" fill="#1b1b1b"/>
        <path d="M100 118 L106 132 L100 146 L94 132 Z" fill="#ffd54f" stroke="#1b1b1b" stroke-width="2"/>`,
      cabeca:`
        <circle cx="100" cy="52" r="36" fill="url(#pele)" stroke="#1b1b1b" stroke-width="3"/>
        <path d="M64 50 Q62 12 100 12 Q140 12 136 50 Q124 30 108 34 Q112 24 98 26 Q90 34 76 34 Q68 40 64 50 Z"
              fill="#2b1a0e" stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round"/>
        ${rosto(100, 57, 0.62)}`
    },
    blocado: {
      nome:"🧱 Blocado",
      ombro:[61,122], braco:28, antebraco:28, grossura:16, forma:"bloco",
      corBraco:"#ff7043", corAntebraco:"url(#pele)", mao:"bloco", corMao:PELE, tamMao:1,
      pescoco:[100,116], quadril:[100,180],
      fundo:`

        <rect x="101" y="176" width="19" height="58" fill="#37306b" stroke="#1b1b1b" stroke-width="3"/>
        <rect x="76" y="228" width="24" height="11" fill="#fff" stroke="#1b1b1b" stroke-width="3"/>
        <rect x="100" y="228" width="24" height="11" fill="#fff" stroke="#1b1b1b" stroke-width="3"/>`,
      tronco:`
        <rect x="70" y="116" width="60" height="64" rx="2" fill="#ff7043" stroke="#1b1b1b" stroke-width="3"/>
        <path d="M100 132 L107 145 L100 158 L93 145 Z" fill="#ffd54f" stroke="#1b1b1b" stroke-width="2"/>`,
      cabeca:`
        <rect x="64" y="40" width="72" height="74" rx="4" fill="url(#pele)" stroke="#1b1b1b" stroke-width="3"/>
        <rect x="62" y="34" width="76" height="20" rx="3" fill="#2b1a0e" stroke="#1b1b1b" stroke-width="3"/>
        <rect x="63" y="52" width="8" height="16" fill="#2b1a0e"/>
        <rect x="129" y="52" width="8" height="16" fill="#2b1a0e"/>
        ${rosto(100, 82, 0.85)}`
    },
    jujuba: {
      nome:"🫘 Jujuba",
      ombro:[57,124], braco:24, antebraco:24, grossura:16, forma:"tubo",
      corBraco:"url(#jujuba)", corAntebraco:"url(#jujuba)", mao:"redonda", corMao:"#f5a623", tamMao:1,
      pescoco:[100,110], quadril:[100,210],
      fundo:`
        <ellipse cx="100" cy="234" rx="46" ry="7" fill="#000" opacity=".35"/>
        <ellipse cx="82" cy="222" rx="15" ry="8" fill="#c76a00" stroke="#1b1b1b" stroke-width="3"/>
        <ellipse cx="118" cy="222" rx="15" ry="8" fill="#c76a00" stroke="#1b1b1b" stroke-width="3"/>`,
      tronco:`
        <rect x="56" y="40" width="88" height="180" rx="44" fill="url(#jujuba)" stroke="#1b1b1b" stroke-width="3"/>
        <path d="M100 150 L106 162 L100 174 L94 162 Z" fill="#fff3dc" stroke="#1b1b1b" stroke-width="2"/>`,
      cabeca:`
        <rect x="64" y="60" width="72" height="48" rx="24" fill="#fff3dc" stroke="#1b1b1b" stroke-width="3"/>
        ${rosto(100, 84, 0.58)}`
    },
    palitinho: {
      nome:"✏️ Palitinho",
      ombro:[100,116], braco:30, antebraco:28, grossura:5, forma:"linha",
      corBraco:CLARO, corAntebraco:CLARO, mao:"palito", corMao:CLARO, tamMao:1.2,
      pescoco:[100,104], quadril:[100,172],
      fundo:`
        <ellipse cx="100" cy="246" rx="40" ry="6" fill="#000" opacity=".35"/>
        <path d="M100 170 L84 240 M100 170 L116 240" stroke="${CLARO}" stroke-width="5" stroke-linecap="round" fill="none"/>`,
      tronco:`<path d="M100 104 L100 172" stroke="${CLARO}" stroke-width="5" stroke-linecap="round"/>`,
      cabeca:`
        <path d="M86 44 Q94 28 100 40 Q106 26 114 44" fill="none" stroke="${CLARO}" stroke-width="4" stroke-linecap="round"/>
        <circle cx="100" cy="72" r="32" fill="#1a1535" stroke="${CLARO}" stroke-width="5"/>
        ${rosto(100, 74, 0.68, CLARO, "#1a1535")}`
    },
    espirito: {
      nome:"👻 Espírito",
      ombro:[56,136], braco:20, antebraco:20, grossura:12, forma:"tubo",
      corBraco:"url(#espirito)", corAntebraco:"url(#espirito)", mao:"redonda", corMao:"#8f80f0", tamMao:0.9,
      pescoco:[100,130], quadril:[100,200],
      fundo:`<ellipse cx="100" cy="240" rx="36" ry="6" fill="#000" opacity=".3"/>`,
      tronco:`
        <path d="M100 40 Q152 40 152 122 Q152 184 128 210 L119 194 L110 214 L100 196 L90 214 L81 194 L72 210 Q48 184 48 122 Q48 40 100 40 Z"
              fill="url(#espirito)" stroke="#26215C" stroke-width="3" stroke-linejoin="round"/>`,
      cabeca:`
        <path d="M100 41 Q90 26 98 10 Q104 24 112 16 Q112 32 100 41 Z" fill="#ffd54f" stroke="#26215C" stroke-width="2" stroke-linejoin="round"/>
        ${rosto(100, 104, 0.75, "#26215C", "#fff")}`
    }
  };

  // cores em degradê usadas pelos estilos
  const DEFS = `<defs>
    <linearGradient id="pele" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdcb8"/><stop offset="1" stop-color="#f0a870"/></linearGradient>
    <linearGradient id="roupa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9d7bff"/><stop offset="1" stop-color="#5a2fd6"/></linearGradient>
    <linearGradient id="calca" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8ed6"/><stop offset="1" stop-color="#3a64a8"/></linearGradient>
    <linearGradient id="jujuba" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc94a"/><stop offset="1" stop-color="#ef8f17"/></linearGradient>
    <linearGradient id="espirito" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3a8ff"/><stop offset="1" stop-color="#6a5ae0"/></linearGradient>
  </defs>`;

  // monta um braço (ombro > cotovelo > pulso > mão). lado = "L" ou "R"
  function braco(e, lado){
    const [x, y] = e.ombro, w = e.grossura;
    const yCotovelo = y + e.braco, yPulso = yCotovelo + e.antebraco;
    const peca = (y0, comp, cor) => e.forma === "linha"
      ? `<path d="M${x} ${y0} L${x} ${y0+comp}" stroke="${cor}" stroke-width="${w}" stroke-linecap="round"/>`
      : `<rect x="${x-w/2}" y="${y0-w/2}" width="${w}" height="${comp+w}" rx="${e.forma==="bloco" ? 2 : w/2}"
               fill="${cor}" stroke="#1b1b1b" stroke-width="2.5"/>`;
    const mao = MAOS[e.mao];
    return `<g id="ombro${lado}" class="junta" style="transform-origin:${x}px ${y}px">
        ${peca(y, e.braco, e.corBraco)}
        <g id="cotovelo${lado}" class="junta" style="transform-origin:${x}px ${yCotovelo}px">
          ${peca(yCotovelo, e.antebraco, e.corAntebraco)}
          <g id="pulso${lado}" class="junta" style="transform-origin:${x}px ${yPulso}px">
            <g transform="translate(${x} ${yPulso}) scale(${e.tamMao})">
              <g class="mao-normal">${mao.normal(e.corMao)}</g>
              <g class="mao-aberta">${mao.aberta(e.corMao)}</g>
            </g>
          </g>
        </g>
      </g>`;
  }

  /* ---------- estado ---------- */
  let S = fresh();
  function fresh(){ return {aura:0, total:0, owned:{}, spinReadyAt:0, saved:Date.now(), estilo:"chibi", nivel:0}; }

  function load(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return;
      const d = JSON.parse(raw);
      S = Object.assign(fresh(), d);
      S.owned = d.owned || {};
    }catch(e){}
  }
  function save(){
    try{ S.saved = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
  }

  /* ---------- cálculos ---------- */
  const own = id => S.owned[id] || 0;
  const cost = u => Math.floor(u.base * Math.pow(GROWTH, own(u.id)));
  function clickBase(){ return 1 + UPGRADES.filter(u=>u.type==="click").reduce((a,u)=>a+u.val*own(u.id),0); }
  function perSec(){ return UPGRADES.filter(u=>u.type==="auto").reduce((a,u)=>a+u.val*own(u.id),0); }
  function nivelAtual(){
    let n = 0;
    NIVEIS.forEach((nv, i)=>{ if(S.total >= nv.aura) n = i; });
    return n;
  }

  let combo = 0;                       // 0..COMBO_MAX
  const mult = () => 1 + Math.floor(combo/10);   // x1 .. x4
  const perClick = () => clickBase() * mult();

  /* ---------- formatação ---------- */
  const SUF = ["","mil","mi","bi","tri","qua"];
  function fmt(n){
    n = Math.floor(n);
    if(n < 10000) return n.toLocaleString("pt-BR");
    let i = 0, v = n;
    while(v >= 1000 && i < SUF.length-1){ v /= 1000; i++; }
    return v.toFixed(v<10?2:v<100?1:0).replace(".",",") + " " + SUF[i];
  }

  /* ---------- elementos ---------- */
  const $ = id => document.getElementById(id);
  const el = {
    score:$("score"), perClick:$("perClick"), perSec:$("perSec"),
    arena:$("arena"), char:$("char"), glow:$("glow"),
    stage:$("stage"), comboBar:$("comboBar"), mult:$("mult"), nivelInfo:$("nivelInfo"),
    spinBtn:$("spinBtn"), cd:$("cd"), shop:$("shopList"), reset:$("reset"),
    svg:null, shades:null   // preenchidos quando o boneco é montado
  };

  /* ---------- boneco: montar e mexer ---------- */
  let juntas = {};
  function montarBoneco(nome){
    const e = ESTILOS[nome] || ESTILOS.chibi;
    el.char.innerHTML = `<svg viewBox="0 0 200 300" width="200" height="300">
      ${DEFS}${e.fundo}
      <g class="respira">
        <g id="corpo" class="junta" style="transform-origin:${e.quadril[0]}px ${e.quadril[1]}px">
          ${e.tronco}
          <g id="cabeca" class="junta" style="transform-origin:${e.pescoco[0]}px ${e.pescoco[1]}px">${e.cabeca}</g>
          ${braco(e, "L")}
          <g transform="translate(200 0) scale(-1 1)">${braco(e, "R")}</g>
        </g>
      </g>
    </svg>`;
    el.svg = el.char.querySelector("svg");
    el.shades = $("shades");
    juntas = {
      oL:$("ombroL"), cL:$("cotoveloL"), pL:$("pulsoL"),
      oR:$("ombroR"), cR:$("cotoveloR"), pR:$("pulsoR"),
      corpo:$("corpo"), cabeca:$("cabeca")
    };
    setPose(REST);
  }
  function setPose(p){
    for(const k in juntas) juntas[k].style.transform = "rotate(" + p[k] + "deg)";
  }
  let poseIdx = -1, restTimer = 0;
  function nextPose(){
    const nivel = NIVEIS[nivelAtual()];
    poseIdx = (poseIdx + 1) % nivel.poses.length;
    setPose(nivel.poses[poseIdx]);
    el.svg.classList.toggle("abrir", nivel.maoAberta);
    // se parar de clicar, volta para a pose parada com a mão normal
    clearTimeout(restTimer);
    restTimer = setTimeout(()=>{ setPose(REST); el.svg.classList.remove("abrir"); }, 900);
  }

  /* ---------- menu de estilos ---------- */
  const estiloBtns = {};
  Object.keys(ESTILOS).forEach(k=>{
    const b = document.createElement("button");
    b.className = "est";
    b.textContent = ESTILOS[k].nome;
    b.addEventListener("click", ()=>{ S.estilo = k; montarBoneco(k); save(); render(); });
    $("estilos").appendChild(b);
    estiloBtns[k] = b;
  });

  /* ---------- loja (DOM) ---------- */
  const shopBtns = {};
  UPGRADES.forEach(u=>{
    const b = document.createElement("button");
    b.className = "up";
    b.innerHTML = '<span class="n"></span><span class="c"></span><span class="d"></span><span class="q"></span>';
    b.addEventListener("click", ()=>buy(u));
    el.shop.appendChild(b);
    shopBtns[u.id] = b;
  });
  function buy(u){
    const c = cost(u);
    if(S.aura < c) return;
    S.aura -= c;
    S.owned[u.id] = own(u.id) + 1;
    save(); render();
  }

  /* ---------- ações ---------- */
  function farm(x, y){
    // cada clique leva o boneco para a próxima pose
    nextPose();

    combo = Math.min(COMBO_MAX, combo + 1.2);
    const g = perClick();
    S.aura += g; S.total += g;
    popup("+" + fmt(g), x, y);
    render();
  }

  function spin(){
    const now = Date.now();
    if(now < S.spinReadyAt) return;
    S.spinReadyAt = now + SPIN_CD;
    const bonus = clickBase()*20*mult() + perSec()*10;
    S.aura += bonus; S.total += bonus;
    el.char.classList.remove("spin"); void el.char.offsetWidth; el.char.classList.add("spin");
    const r = el.arena.getBoundingClientRect();
    popup("🌀 +" + fmt(bonus), r.width/2, 30, true);
    save(); render();
  }

  function popup(txt, x, y, big){
    const p = document.createElement("div");
    p.className = "pop";
    p.textContent = txt;
    p.style.left = (x - 20 + (Math.random()*30-15)) + "px";
    p.style.top  = (y - 10) + "px";
    p.style.fontSize = big ? "1.5rem" : "1.1rem";
    el.arena.appendChild(p);
    setTimeout(()=>p.remove(), 900);
  }

  /* ---------- entrada ---------- */
  el.arena.addEventListener("pointerdown", e=>{
    e.preventDefault();
    const r = el.arena.getBoundingClientRect();
    farm(e.clientX - r.left, e.clientY - r.top);
  });
  el.spinBtn.addEventListener("click", spin);
  window.addEventListener("keydown", e=>{
    if(e.repeat) return;
    const k = e.key.toLowerCase();
    if(k===" "){ e.preventDefault(); spin(); }
    else if(["a","d","arrowleft","arrowright"].includes(k)){
      e.preventDefault();
      farm(el.arena.clientWidth/2, 120);
    }
  });
  el.reset.addEventListener("click", ()=>{
    if(confirm("Apagar todo o progresso e recomeçar?")){
      const estilo = S.estilo;          // o boneco escolhido continua o mesmo
      S = fresh(); S.estilo = estilo; combo = 0; save(); render();
    }
  });

  /* ---------- render ---------- */
  function render(){
    el.score.textContent = fmt(S.aura);
    el.perClick.textContent = fmt(perClick());
    el.perSec.textContent = fmt(perSec());
    el.mult.textContent = "x" + mult();
    el.comboBar.style.width = (combo/COMBO_MAX*100) + "%";

    // brilho cresce com a aura total
    const glow = Math.min(420, 160 + Math.log10(S.total+1)*45);
    el.glow.style.setProperty("--glow", glow + "px");
    el.arena.classList.toggle("gold", S.total >= 100000);
    el.shades.classList.toggle("on", own("oculos") > 0);

    // movimento atual e o próximo a liberar
    const n = nivelAtual(), prox = NIVEIS[n+1];
    el.nivelInfo.innerHTML = "Movimento: <b>" + NIVEIS[n].nome + "</b>" +
      (prox ? " <span>· próximo: " + prox.nome + " com " + fmt(prox.aura) + " de aura</span>"
            : " <span>· todos liberados!</span>");

    for(const k in estiloBtns) estiloBtns[k].classList.toggle("ativo", k === S.estilo);

    UPGRADES.forEach(u=>{
      const b = shopBtns[u.id], c = cost(u);
      b.querySelector(".n").textContent = u.name;
      b.querySelector(".c").textContent = fmt(c);
      b.querySelector(".d").textContent = u.desc;
      b.querySelector(".q").textContent = own(u.id) ? "x" + own(u.id) : "";
      b.disabled = S.aura < c;
    });
  }

  /* ---------- loop ---------- */
  let last = performance.now(), saveT = 0;
  function tick(now){
    const dt = Math.min(0.25, (now-last)/1000); last = now;

    const gain = perSec()*dt;
    if(gain){ S.aura += gain; S.total += gain; }

    // combo cai com o tempo
    combo = Math.max(0, combo - dt*4);

    // liberou um movimento novo?
    const n = nivelAtual();
    if(n > S.nivel){
      S.nivel = n;
      popup("✨ Novo movimento: " + NIVEIS[n].nome, 40, 60, true);
      save();
    }

    // recarga do giro
    const left = Math.max(0, S.spinReadyAt - Date.now());
    el.spinBtn.disabled = left > 0;
    el.cd.style.width = (left/SPIN_CD*100) + "%";

    saveT += dt; if(saveT > 5){ saveT = 0; save(); }
    render();
    requestAnimationFrame(tick);
  }

  /* ---------- início ---------- */
  load();
  montarBoneco(S.estilo);
  // ganho enquanto estava fora (até 1h, a 50%)
  const away = Math.min(3600, (Date.now() - (S.saved||Date.now()))/1000);
  if(away > 30 && perSec() > 0){
    const g = perSec()*away*0.5;
    S.aura += g; S.total += g;
  }
  render();
  requestAnimationFrame(tick);
  window.addEventListener("beforeunload", save);
})();
</script>
</body>
</html>
