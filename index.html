<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Farmar Aura</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <main class="stage" id="stage">
    <h1>Farmar Aura</h1>
    <div class="score" id="score">0</div>
    <p class="rate"><b id="perClick">1</b> por clique · <b id="perSec">0</b> por segundo</p>

    <div class="arena" id="arena" aria-label="Clique para farmar aura">
      <div class="glow" id="glow"></div>
      <div class="char" id="char"><!-- o boneco é desenhado pelo JS (veja ESTILOS) --></div>
    </div>

    <div class="combo">
      <div class="lbl"><span>Combo <b id="mult">x1</b></span><span>mantenha o ritmo!</span></div>
      <div class="bar"><i id="comboBar"></i></div>
    </div>
    <p class="nivel" id="nivelInfo"></p>

    <div class="btns">
      <button class="spinbtn" id="spinBtn">🌀 Giro da Aura (espaço)<span class="cd" id="cd"></span></button>
    </div>
    <p class="hint">Clique no boneco, ou use <b>A / D</b> e as <b>setas</b>. O giro dá aura extra.</p>
  </main>

  <aside class="shop">
    <h2>Boneco</h2>
    <div class="estilos" id="estilos"></div>
    <h2>Melhorias</h2>
    <div id="shopList" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="foot"><span id="saveInfo">Salvo automaticamente</span><button id="reset">Recomeçar</button></div>
  </aside>
</div>

<script src="game.js"></script>
</body>
</html>
